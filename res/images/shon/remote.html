<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f11">
<title>ShonDJ Remote</title>
<style>
:root {
  --bg: #0f0f11; --card: #17171a; --line: #26262b; --text: #f2f2f4; --dim: #8a8a92;
  --blue: #2f6bff; --orange: #f2a33b; --red: #ff3b30; --green: #34c759;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { padding: env(safe-area-inset-top) 0 calc(118px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 0; }
.top { display: flex; align-items: center; justify-content: space-between; }
.logo { display: block; height: 26px; width: auto; }
.pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card); color: var(--dim); display: flex; gap: 6px; align-items: center; }
.away { margin-left: auto; margin-right: 8px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.away.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
.pill.lan i { background: var(--green); } .pill.relay i { background: var(--orange); } .pill.off i { background: var(--red); }
nav { display: flex; gap: 6px; margin-top: 12px; border-bottom: 1px solid var(--line); }
nav button { flex: 1; background: none; border: none; color: var(--dim); font-size: 14px; font-weight: 600; padding: 10px 0; border-bottom: 2px solid transparent; }
nav button.on { color: var(--text); border-bottom-color: var(--blue); }
main { padding: 12px 16px; }
.view { display: none; } .view.on { display: block; }
.deck { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.dhead { display: flex; gap: 10px; align-items: center; }
.num { width: 28px; height: 28px; border-radius: 8px; background: #222228; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
.deck.playing .num { background: var(--blue); }
.tt { flex: 1; min-width: 0; }
.title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.bpm { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; text-align: right; flex: none; }
.bar { height: 6px; background: #26262b; border-radius: 3px; margin: 12px 0 4px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: var(--blue); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.times .left.warn { color: var(--red); font-weight: 700; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; height: 52px; border-radius: 12px; border: none; background: #232329; color: var(--text); font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.btn.play { flex: 1.6; }
.btn.play.on { background: var(--blue); }
.btn.sync.on { background: #233a7a; color: #fff; }
.btn:active { filter: brightness(1.4); }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.pad { height: 42px; border-radius: 9px; border: none; background: #1d1d22; color: var(--dim); font-size: 11px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; }
.pad.set { color: #0f0f11; }
.pad:active { filter: brightness(1.3); }
.slider { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.slider label { width: 56px; font-size: 12px; color: var(--dim); font-weight: 600; flex: none; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 36px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #2a2a30; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #e6e6ea; margin-top: -10px; border: none; }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #2a2a30; }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #e6e6ea; border: none; }
.stems { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 4px; }
.stem { display: flex; align-items: center; gap: 10px; }
.stem label { width: 56px; font-size: 12px; color: var(--dim); font-weight: 600; flex: none; }
.mute { width: 40px; height: 32px; border-radius: 8px; border: none; background: #232329; color: var(--dim); font-weight: 700; flex: none; }
.mute.on { background: var(--red); color: #fff; }
.empty { color: var(--dim); text-align: center; padding: 30px 0; font-size: 14px; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; padding: 0 14px; outline: none; }
.search:focus { border-color: var(--blue); }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item .tt .title { font-size: 14px; }
.item .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
.ld { width: 40px; height: 36px; border-radius: 9px; border: none; background: #232329; color: var(--text); font-weight: 700; flex: none; }
.ld:active { background: var(--blue); }
.votes { font-size: 12px; color: var(--orange); font-weight: 700; }
.note { color: var(--dim); font-size: 12px; flex: none; }
footer { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,15,17,0.96); border-top: 1px solid var(--line); padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
footer .slider { margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: #2a2a30; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; }
</style>
</head>

    <input class="search" id="q" type="search" placeholder="Search your library" autocomplete="off">

  </div>

<footer>
  <div class="slider"><label>Fader</label><input type="range" id="xf" min="0" max="1" step="0.005" value="0.5"></div>
  <div class="slider"><label>Main</label><input type="range" id="gain" min="0" max="1" step="0.01" value="1"></div>
</footer>
<div class="toast" id="toast"></div>
<script>
/*SHON_CONFIG*/
(function () {
  var cfg = window.SHON || {};
  var mode = cfg.mode || "lan";      // how this page was opened
  var transport = mode;               // what we are using right now
  var lanFails = 0, relayFails = 0, lastOk = 0, busy = false;
  var state = null, decksBuilt = "", holdUntil = {};
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function toast(text) {
    var t = $("toast"); t.textContent = text; t.classList.add("on");
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.classList.remove("on"); }, 1600);
  }
  function fmt(sec) {
    if (!(sec >= 0)) return "0:00";
    sec = Math.floor(sec); var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function withTimeout(ms) {
    var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal;
  }

  // ---- transport ----
  function stateUrl(t) {
    return t === "lan" ? "/api/state?k=" + encodeURIComponent(cfg.key)
                       : cfg.relay + "/rstate?k=" + encodeURIComponent(cfg.phoneKey);
  }
  function fetchState(t) {
    return fetch(stateUrl(t), { cache: "no-store", signal: withTimeout(t === "lan" ? 1500 : 4000) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function send(cmd) {
    var t = transport;
    var req = t === "lan"
      ? fetch("/api/cmd?k=" + encodeURIComponent(cfg.key), { method: "POST", body: JSON.stringify(cmd), signal: withTimeout(1500) })
      : fetch(cfg.relay + "/rcmd", { method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ k: cfg.phoneKey, cmd: cmd }), signal: withTimeout(4000) });
    return req.then(function (r) { if (!r.ok) throw new Error(r.status); })
      .catch(function () {
        if (t === "lan" && cfg.relay) { setTransport("relay"); return send(cmd); }
      });
  }
  function setTransport(t) {
    if (transport === t) return;
    transport = t; lanFails = 0; relayFails = 0;
    toast(t === "lan" ? "Back on Wi-Fi" : "Wi-Fi lost, using backup");
    pill();
  }
  function pill() {
    var p = $("pill"), live = Date.now() - lastOk < 5000 && state && state.host !== false;
    p.className = "pill " + (live ? transport : "off");
    $("pilltext").textContent = !live ? "Offline" : transport === "lan" ? "Wi-Fi" : "Backup";
  }
  var lastRelayPoll = 0;
  function loop() {
    if (busy) return;
    if (transport === "relay") {
      // The backup goes through the internet, so ask less often.
      var now = Date.now(); if (now - lastRelayPoll < 800) return; lastRelayPoll = now;
    }
    busy = true;
    fetchState(transport).then(function (s) {
      busy = false; lastOk = Date.now(); lanFails = 0; relayFails = 0;
      state = s; render(); pill();
    }).catch(function () {
      busy = false;
      if (transport === "lan") {
        lanFails++;
        if (lanFails >= 2 && cfg.relay) setTransport("relay");
      } else relayFails++;
      pill();
    });
  }
  setInterval(loop, 250);
  // While on the backup, keep checking if Wi-Fi is back.
  setInterval(function () {
    if (mode === "lan" && transport === "relay") {
      fetchState("lan").then(function () { setTransport("lan"); }).catch(function () {});
    }
  }, 4000);

  // ---- tabs ----
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("nav button").forEach(function (x) { x.classList.remove("on"); });
      document.querySelectorAll(".view").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on"); $("v-" + b.dataset.v).classList.add("on");
    });
  });

  // ---- sliders: send while dragging, ignore server values for a moment ----
  function bindSlider(el, key, makeCmd) {
    var pending = null, timer = null;
    function flush() { timer = null; if (pending != null) { send(makeCmd(pending)); pending = null; } }
    el.addEventListener("input", function () {
      holdUntil[key] = Date.now() + 1200;
      pending = parseFloat(el.value);
      if (!timer) timer = setTimeout(flush, 70);
    });
  }
  function setSlider(el, key, v) {
    if (Date.now() < (holdUntil[key] || 0)) return;
    if (document.activeElement === el) return;
    el.value = v;
  }
  $("away").addEventListener("click", function () {
    var on = !(state && state.away);
    send({ c: "away", v: on ? 1 : 0 });
    toast(on ? "Away Mode on: ShonDJ keeps the music going" : "Away Mode off");
  });
  bindSlider($("xf"), "xf", function (v) { return { c: "master", k: "crossfader", v: v }; });
  bindSlider($("gain"), "gain", function (v) { return { c: "master", k: "gain", v: v }; });

  // Hold-to-press buttons (cue, hot cues): 1 on press, 0 on release.
  function pressable(el, cmdFor) {
    var down = false;
    function start(e) { e.preventDefault(); if (down) return; down = true; el.classList.add("down"); send(cmdFor(1)); }
    function end(e) { if (!down) return; down = false; el.classList.remove("down"); send(cmdFor(0)); }
    el.addEventListener("touchstart", start, { passive: false });
    el.addEventListener("touchend", end); el.addEventListener("touchcancel", end);
    el.addEventListener("mousedown", start); el.addEventListener("mouseup", end); el.addEventListener("mouseleave", end);
  }

  // ---- decks ----
  var STEM_NAMES = ["Drums", "Bass", "Melody", "Vocals"];
  function buildDecks(decks) {
    var html = "";
    decks.forEach(function (d) {
      var n = d.n;
      html += '<div class="deck" id="deck' + n + '">' +
        '<div class="dhead"><div class="num">' + n + '</div><div class="tt">' +
        '<div class="title" id="t' + n + '"></div><div class="artist" id="a' + n + '"></div></div>' +
        '<div class="bpm" id="b' + n + '"></div></div>' +
        '<div class="bar"><div id="p' + n + '"></div></div>' +
        '<div class="times"><span id="el' + n + '">0:00</span><span class="left" id="lf' + n + '">0:00</span></div>' +
        '<div class="row"><button class="btn" id="cue' + n + '">CUE</button>' +
        '<button class="btn play" id="play' + n + '">PLAY</button>' +
        '<button class="btn sync" id="sync' + n + '">SYNC</button></div>' +
        '<div class="pads">';
      for (var h = 1; h <= 8; h++) html += '<button class="pad" id="hc' + n + '_' + h + '">' + h + '</button>';
      html += '</div><div class="slider"><label>Volume</label><input type="range" id="vol' + n + '" min="0" max="1" step="0.01"></div>' +
        '<div class="stems" id="st' + n + '">';
      for (var s = 1; s <= 4; s++) {
        html += '<div class="stem"><label>' + STEM_NAMES[s - 1] + '</label>' +
          '<input type="range" id="sv' + n + '_' + s + '" min="0" max="1" step="0.01">' +
          '<button class="mute" id="sm' + n + '_' + s + '">M</button></div>';
      }
      html += '</div></div>';
    });
    $("decks").innerHTML = html;
    decks.forEach(function (d) {
      var n = d.n;
      pressable($("cue" + n), function (v) { return { c: "set", d: n, k: "cue_default", v: v }; });
      $("play" + n).addEventListener("click", function () {
        var deck = findDeck(n); send({ c: "set", d: n, k: "play", v: deck && deck.play ? 0 : 1 });
      });
      $("sync" + n).addEventListener("click", function () {
        var deck = findDeck(n); send({ c: "set", d: n, k: "sync_enabled", v: deck && deck.sync ? 0 : 1 });
      });
      for (var h = 1; h <= 8; h++) (function (h) {
        pressable($("hc" + n + "_" + h), function (v) { return { c: "set", d: n, k: "hotcue_" + h + "_activate", v: v }; });
      })(h);
      bindSlider($("vol" + n), "vol" + n, function (v) { return { c: "set", d: n, k: "volume", v: v }; });
      for (var s = 1; s <= 4; s++) (function (s) {
        bindSlider($("sv" + n + "_" + s), "sv" + n + "_" + s, function (v) { return { c: "stem", d: n, s: s, k: "volume", v: v }; });
        $("sm" + n + "_" + s).addEventListener("click", function () {
          var deck = findDeck(n), st = deck && deck.stems && deck.stems[s - 1];
          send({ c: "stem", d: n, s: s, k: "mute", v: st && st.mute ? 0 : 1 });
        });
      })(s);
    });
  }
  function findDeck(n) {
    if (!state || !state.decks) return null;
    for (var i = 0; i < state.decks.length; i++) if (state.decks[i].n === n) return state.decks[i];
    return null;
  }
  function render() {
    if (!state) return;
    var decks = state.decks || [];
    var sig = decks.map(function (d) { return d.n; }).join(",");
    if (sig !== decksBuilt) { decksBuilt = sig; buildDecks(decks); }
    decks.forEach(function (d) {
      var n = d.n;
      $("deck" + n).classList.toggle("playing", !!d.play);
      $("t" + n).textContent = d.loaded ? (d.title || "Unknown") : "Empty";
      $("a" + n).textContent = d.loaded ? (d.artist || "") : "Load a song from Library";
      $("b" + n).textContent = d.loaded && d.bpm ? d.bpm.toFixed(1) + " BPM" : "";
      var pos = Math.max(0, Math.min(1, d.pos || 0));
      $("p" + n).style.width = (pos * 100) + "%";
      $("el" + n).textContent = fmt(pos * d.dur);
      var left = (1 - pos) * d.dur;
      $("lf" + n).textContent = "-" + fmt(left);
      $("lf" + n).classList.toggle("warn", d.play && left < 30);
      $("play" + n).classList.toggle("on", !!d.play);
      $("play" + n).textContent = d.play ? "PAUSE" : "PLAY";
      $("sync" + n).classList.toggle("on", !!d.sync);
      setSlider($("vol" + n), "vol" + n, d.vol);
      var cues = {};
      (d.cues || []).forEach(function (c) { cues[c.n] = c; });
      for (var h = 1; h <= 8; h++) {
        var b = $("hc" + n + "_" + h), c = cues[h];
        b.classList.toggle("set", !!c);
        b.style.background = c ? (c.color || "#f2a33b") : "";
        b.textContent = c && c.label ? c.label : String(h);
      }
      var hasStems = d.stems && d.stems.length;
      $("st" + n).style.display = hasStems ? "" : "none";
      if (hasStems) {
        for (var s = 1; s <= 4; s++) {
          var st = d.stems[s - 1] || { vol: 1, mute: false };
          setSlider($("sv" + n + "_" + s), "sv" + n + "_" + s, st.vol);
          $("sm" + n + "_" + s).classList.toggle("on", !!st.mute);
        }
      }
    });
    $("away").classList.toggle("on", !!state.away);
    setSlider($("xf"), "xf", state.xf);
    setSlider($("gain"), "gain", state.gain);
    renderResults(); renderRequests();
  }

  function loadButtons(attr) {
    var decks = (state && state.decks) || [];
    return decks.map(function (d) { return '<button class="ld" data-d="' + d.n + '" ' + attr + '>' + d.n + '</button>'; }).join("");
  }

  // ---- library search ----
  var lastQuery = "", resultsSig = "";
  $("q").addEventListener("input", function () {
    clearTimeout(this.timer);
    var q = this.value.trim();
    this.timer = setTimeout(function () {
      lastQuery = q;
      resultsSig = "";
      if (q.length === 0 || q.length >= 2) send({ c: "search", q: q });
    }, 300);
  });
  function renderResults() {
    var s = state.search;
    if (!s || s.q !== lastQuery) return;
    var sig = s.q + "|" + (s.results || []).length + "|" + ((state.decks || []).length);
    if (sig === resultsSig) return;
    resultsSig = sig;
    if (!s.results || !s.results.length) { $("results").innerHTML = '<div class="empty">Nothing found.</div>'; return; }
    $("results").innerHTML = s.results.map(function (r) {
      return '<div class="item"><div class="tt"><div class="title">' + esc(r.title) + '</div>' +
        '<div class="meta">' + esc(r.artist) + (r.bpm ? " &middot; " + r.bpm.toFixed(0) + " BPM" : "") +
        (r.key ? " &middot; " + esc(r.key) : "") + '</div></div>' + loadButtons('data-id="' + r.id + '"') + '</div>';
    }).join("");
  }
  $("results").addEventListener("click", function (e) {
    var b = e.target.closest(".ld"); if (!b) return;
    send({ c: "load", d: Number(b.dataset.d), id: Number(b.dataset.id) });
    toast("Loading on deck " + b.dataset.d);
  });

  // ---- requests ----
  var reqSig = "";
  function renderRequests() {
    var list = state.requests || [];
    var sig = JSON.stringify(list) + (state.decks || []).length;
    if (sig === reqSig) return;
    reqSig = sig;
    if (!list.length) { $("requests").innerHTML = '<div class="empty">No requests yet.</div>'; return; }
    $("requests").innerHTML = list.map(function (r) {
      var right = r.has ? loadButtons('data-rid="' + esc(r.id) + '"') : '<span class="note">Not in library</span>';
      return '<div class="item"><div class="tt"><div class="title">' + esc(r.song) + '</div>' +
        '<div class="meta">' + (r.votes > 1 ? '<span class="votes">' + r.votes + ' votes</span> &middot; ' : "") +
        esc((r.names || []).join(", ")) + (r.status && r.status !== "new" ? " &middot; " + esc(r.status) : "") +
        '</div></div>' + right + '</div>';
    }).join("");
  }
  $("requests").addEventListener("click", function (e) {
    var b = e.target.closest(".ld"); if (!b) return;
    send({ c: "loadreq", d: Number(b.dataset.d), id: b.dataset.rid });
    toast("Loading on deck " + b.dataset.d);
  });

  loop();
  // Library tab starts with the whole library.
  send({ c: "search", q: "" });
})();
</script>
</body>
</html>
